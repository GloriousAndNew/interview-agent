[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "interview-agent"
dynamic = ["version"]
description = "Local interview recording knowledge base with cloud ASR and DeepSeek"
requires-python = ">=3.11"
dependencies = ["streamlit>=1.66,<2", "pydantic>=2.10,<3", "httpx>=0.28,<1", "imageio-ffmpeg>=0.6,<1", "oss2>=2.19,<3", "pypdf>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
server = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1"]

[tool.setuptools.packages.find]
include = ["interview_agent*"]

[tool.setuptools.dynamic]
version = {attr = "interview_agent.__version__"}

[tool.setuptools.package-data]
interview_agent = ["ui.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

